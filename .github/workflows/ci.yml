name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The test suite is zero-dependency (pure Node), so it runs without any install.
      - name: Run tests (smoke + data-layer)
        run: npm test

      # Syntax-check every source file.
      - name: Syntax check all source files
        run: |
          set -e
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node --check server.js

      # Dev-only tooling (TypeScript checkJs + ESLint). Installed here in CI,
      # never required for the app itself (the app ships zero runtime deps).
      - name: Install dev tooling
        run: npm install --no-save typescript@5.6.3 eslint@9.13.0

      - name: Type-check (JSDoc via checkJs)
        run: npx tsc -p tsconfig.json
        continue-on-error: true

      - name: Lint
        run: npx eslint .
        continue-on-error: true
